<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Summer Strong · Trainer Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,700;1,300&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sun: #F5B820;
    --sun-dark: #D4920C;
    --sky: #0A1628;
    --sky-mid: #122040;
    --sky-light: #1C3060;
    --white: #F9F5EE;
    --muted: #8A9BC0;
    --accent: #FF6B35;
    --green: #3DD68C;
    --radius: 18px;
  }

  html, body { height: 100%; background: var(--sky); color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 15px; line-height: 1.55; }

  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, rgba(245,184,32,.18) 0%, transparent 70%),
      radial-gradient(ellipse 80% 60% at 80% 100%, rgba(255,107,53,.10) 0%, transparent 60%),
      linear-gradient(180deg, #0A1628 0%, #122040 100%);
    pointer-events: none;
  }
  body::after {
    content: ''; position: fixed; top: -60px; left: 50%; transform: translateX(-50%);
    width: 700px; height: 340px; z-index: 0;
    background: repeating-conic-gradient(from 0deg at 50% 0%, rgba(245,184,32,.06) 0deg 5deg, transparent 5deg 12deg);
    pointer-events: none;
  }

  #app { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100vh; max-width: 680px; margin: 0 auto; }

  /* HEADER */
  header {
    padding: 18px 24px 14px; display: flex; align-items: center; gap: 14px;
    border-bottom: 1px solid rgba(245,184,32,.15);
    backdrop-filter: blur(12px); background: rgba(10,22,40,.6); flex-shrink: 0;
  }
  .logo-sun {
    width: 44px; height: 44px; flex-shrink: 0; background: var(--sun); border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 22px;
    box-shadow: 0 0 0 4px rgba(245,184,32,.2), 0 0 24px rgba(245,184,32,.35);
    animation: pulse-sun 3s ease-in-out infinite;
  }
  @keyframes pulse-sun {
    0%,100% { box-shadow: 0 0 0 4px rgba(245,184,32,.2), 0 0 24px rgba(245,184,32,.35); }
    50%      { box-shadow: 0 0 0 8px rgba(245,184,32,.12), 0 0 40px rgba(245,184,32,.5); }
  }
  .header-text h1 { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--sun); line-height: 1; }
  .header-text p { font-size: 12px; color: var(--muted); font-weight: 300; letter-spacing: .5px; }
  .status-dot { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--green); letter-spacing: .5px; font-weight: 500; }
  .status-dot::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(61,214,140,.2); animation: blink 2s ease-in-out infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* CHAT */
  #chat { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: rgba(245,184,32,.25); border-radius: 4px; }

  /* MESSAGES */
  .msg { display: flex; gap: 10px; max-width: 88%; animation: slide-in .28s cubic-bezier(.22,1,.36,1) both; }
  @keyframes slide-in { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.ai   { align-self: flex-start; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 15px; margin-top: 2px; }
  .msg.ai .avatar  { background: var(--sun); box-shadow: 0 0 12px rgba(245,184,32,.4); }
  .msg.user .avatar { background: var(--sky-light); border: 1px solid rgba(245,184,32,.3); }
  .bubble { padding: 12px 16px; border-radius: var(--radius); line-height: 1.6; font-size: 14.5px; }
  .msg.ai .bubble  { background: #1C3060; border: 1px solid rgba(245,184,32,.12); border-bottom-left-radius: 4px; color: var(--white); }
  .msg.user .bubble { background: var(--sun); border-bottom-right-radius: 4px; color: var(--sky); font-weight: 500; }
  .bubble strong { font-weight: 700; }
  .bubble ul { padding-left: 18px; margin-top: 6px; }
  .bubble li { margin-bottom: 3px; }

  /* IMAGE PREVIEW IN BUBBLE */
  .bubble img.thumb { max-width: 220px; max-height: 180px; border-radius: 10px; display: block; margin-bottom: 8px; object-fit: cover; }

  /* TYPING */
  .typing-indicator { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
  .typing-indicator span { width: 7px; height: 7px; border-radius: 50%; background: var(--sun); animation: bounce .9s ease-in-out infinite; }
  .typing-indicator span:nth-child(2){animation-delay:.18s} .typing-indicator span:nth-child(3){animation-delay:.36s}
  @keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}}

  /* QUICK PROMPTS */
  #quick-wrap { padding: 0 20px 10px; display: flex; gap: 8px; flex-wrap: wrap; flex-shrink: 0; }
  .quick { background: rgba(245,184,32,.1); border: 1px solid rgba(245,184,32,.25); color: var(--sun); border-radius: 20px; padding: 6px 14px; font-size: 12.5px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background .2s, transform .15s; white-space: nowrap; }
  .quick:hover { background: rgba(245,184,32,.22); transform: translateY(-1px); }

  /* IMAGE PREVIEW STRIP (above input) */
  #img-preview-wrap {
    padding: 0 20px 8px; flex-shrink: 0; display: none; gap: 10px; align-items: center;
  }
  #img-preview-wrap.has-image { display: flex; }
  #img-preview {
    width: 64px; height: 64px; border-radius: 10px; object-fit: cover;
    border: 2px solid var(--sun);
  }
  #img-remove {
    width: 26px; height: 26px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(255,107,53,.8); color: #fff; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: background .2s;
  }
  #img-remove:hover { background: var(--accent); }
  .img-label { font-size: 12px; color: var(--muted); }

  /* INPUT BAR */
  #input-bar { padding: 14px 20px 20px; display: flex; gap: 10px; align-items: flex-end; border-top: 1px solid rgba(245,184,32,.1); backdrop-filter: blur(12px); background: rgba(10,22,40,.7); flex-shrink: 0; }

  /* hidden file input */
  #file-input { display: none; }

  /* photo button */
  #photo-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(245,184,32,.3);
    background: rgba(245,184,32,.08); cursor: pointer; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    transition: background .2s, transform .15s;
  }
  #photo-btn:hover { background: rgba(245,184,32,.18); transform: scale(1.06); }
  #photo-btn.has-image { background: rgba(245,184,32,.25); border-color: var(--sun); }

  #msg-input { flex: 1; resize: none; min-height: 44px; max-height: 120px; background: rgba(28,48,96,.7); border: 1px solid rgba(245,184,32,.2); border-radius: 14px; padding: 11px 16px; color: var(--white); font-family: 'DM Sans', sans-serif; font-size: 14px; line-height: 1.5; outline: none; transition: border-color .2s; }
  #msg-input::placeholder { color: var(--muted); }
  #msg-input:focus { border-color: rgba(245,184,32,.55); }

  #send-btn { width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; background: var(--sun); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .15s, background .2s; box-shadow: 0 0 16px rgba(245,184,32,.4); }
  #send-btn:hover { transform: scale(1.08); background: var(--sun-dark); }
  #send-btn:active { transform: scale(.96); }
  #send-btn svg { fill: var(--sky); }
  #send-btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-sun">☀️</div>
    <div class="header-text">
      <h1>Summer Strong</h1>
      <p>Your 90-Day Challenge Trainer · March 30 – June 27</p>
    </div>
    <div class="status-dot">LIVE</div>
  </header>

  <div id="chat"></div>

  <div id="quick-wrap">
    <button class="quick" onclick="quickSend('What are the daily goals?')">Daily goals 📋</button>
    <button class="quick" onclick="quickSend('How do I hit my protein goal?')">Protein tips 💪</button>
    <button class="quick" onclick="quickSend('How much water should I drink?')">Water goal 💧</button>
    <button class="quick" onclick="quickSend('What counts as closing my green ring?')">Green ring 🟢</button>
    <button class="quick" onclick="quickSend('Give me a high protein meal idea')">Meal idea 🍗</button>
    <button class="quick" onclick="quickSend('I\'m struggling with motivation — help!')">Motivation 🔥</button>
  </div>

  <!-- Image preview strip -->
  <div id="img-preview-wrap">
    <img id="img-preview" src="" alt="preview" />
    <div>
      <div class="img-label">Photo ready to send</div>
      <button id="img-remove" onclick="removeImage()" title="Remove">✕</button>
    </div>
  </div>

  <div id="input-bar">
    <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)" />
    <button id="photo-btn" onclick="document.getElementById('file-input').click()" title="Attach photo">📷</button>
    <textarea id="msg-input" placeholder="Ask your trainer anything… or snap a food photo!" rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M2 21L23 12 2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<script>
const SYSTEM_PROMPT = `You are the official AI Trainer for the "90 Day Summer Strong Challenge" — a friendly, motivating fitness accountability competition running from March 30 to June 27, 2026. You speak like a knowledgeable, encouraging personal trainer and friend — warm, direct, no fluff.

CHALLENGE RULES & GOALS (these are the official rules — refer to them accurately):
- Duration: 90 days, March 30 – June 27, 2026
- Buy-in: $20 per participant
- 13 participants total
- Daily goals participants must hit to earn points:
  1. 🥩 PROTEIN — hit their personal daily protein goal (based on body weight, typically ~0.7–1g per lb of bodyweight)
  2. 💧 WATER — drink enough water (minimum 64–100 oz per day, varies by person)
  3. 🟢 GREEN RING — close their Apple Watch green ring (Exercise ring — 30 minutes of purposeful movement)
  4. 🔴 RED RING — close their Apple Watch red ring (Move ring — hit their active calorie goal)
- All 4 goals are tracked daily
- The app lives at summer-strong.vercel.app

If a user sends a food photo, analyze it and estimate:
- Approximate protein content
- Whether it's a solid choice for the challenge
- Any quick tips to make it higher protein if applicable
Be encouraging — celebrate good food choices!

YOUR ROLE:
- Help participants understand the rules, goals, and how to track them
- Give practical, actionable nutrition and fitness advice
- Offer meal ideas, workout suggestions, hydration hacks
- Keep people motivated and accountable
- Answer questions about Apple Watch ring tracking
- Be supportive when someone is struggling; celebrate wins
- Keep answers concise and punchy — this is a mobile app
- Use the occasional relevant emoji to keep it fun ☀️💪🔥

IMPORTANT:
- You do NOT have access to individual participant scores or data — direct them to summer-strong.vercel.app for that
- If asked about specific point standings, tell them to check the app
- Always keep it positive and encouraging`;

let isLoading = false;
let pendingImageBase64 = null;   // base64 string (no prefix)
let pendingImageType = null;     // e.g. "image/jpeg"
let pendingImageDataURL = null;  // for local preview

const chat = document.getElementById('chat');
const input = document.getElementById('msg-input');
const sendBtn = document.getElementById('send-btn');
const photoBtn = document.getElementById('photo-btn');
const imgPreviewWrap = document.getElementById('img-preview-wrap');
const imgPreview = document.getElementById('img-preview');
const fileInput = document.getElementById('file-input');

// Conversation history (text-only representation for multi-turn)
// Images are sent only once (not repeated in history to save tokens)
const history = [];

/* ─── FILE HANDLING ─── */
function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
reader.onload = ev => {
    const img = new Image();
    img.onload = () => {
        const canvas = document.createElement('canvas');
        const max = 1000;
        const scale = Math.min(max / img.width, max / img.height, 1);
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        const dataURL = canvas.toDataURL('image/jpeg', 0.8);
        pendingImageDataURL = dataURL;
        pendingImageBase64 = dataURL.split(',')[1];
        pendingImageType = 'image/jpeg';
        imgPreview.src = dataURL;
        imgPreviewWrap.classList.add('has-image');
        photoBtn.classList.add('has-image');
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  fileInput.value = ''; // reset so same file can be re-selected
}

function removeImage() {
  pendingImageBase64 = null;
  pendingImageType = null;
  pendingImageDataURL = null;
  imgPreviewWrap.classList.remove('has-image');
  photoBtn.classList.remove('has-image');
  imgPreview.src = '';
}

/* ─── CHAT UI ─── */
function appendMsg(role, html, imgDataURL = null, animate = true) {
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  if (!animate) div.style.animation = 'none';

  const imgHtml = imgDataURL
    ? `<img class="thumb" src="${imgDataURL}" alt="uploaded photo" />`
    : '';

  div.innerHTML = `
    <div class="avatar">${role === 'user' ? '🙋' : '☀️'}</div>
    <div class="bubble">${imgHtml}${html}</div>
  `;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai'; div.id = 'typing';
  div.innerHTML = `<div class="avatar">☀️</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}
function removeTyping() { const el = document.getElementById('typing'); if (el) el.remove(); }

function formatText(text) {
  return text
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.*?)\*/g, '<em>$1</em>')
    .replace(/^- (.+)/gm, '<li>$1</li>')
    .replace(/(<li>[\s\S]*<\/li>)/, '<ul>$1</ul>')
    .replace(/\n\n/g, '<br>');
}

/* ─── SEND ─── */
async function sendMessage() {
  const text = input.value.trim();
  if ((!text && !pendingImageBase64) || isLoading) return;

  const sentText = text || '(photo sent)';
  const sentImage = pendingImageBase64;
  const sentImageType = pendingImageType;
  const sentImageDataURL = pendingImageDataURL;

  input.value = '';
  input.style.height = 'auto';
  removeImage();

  isLoading = true;
  sendBtn.disabled = true;

  // Show user bubble with optional image preview
  appendMsg('user', sentText !== '(photo sent)' ? sentText : '', sentImageDataURL);

  showTyping();

  // Build the message content array for this turn
  const userContent = [];
  if (sentImage) {
    userContent.push({ type: 'image', source: { type: 'base64', media_type: sentImageType, data: sentImage } });
  }
  userContent.push({ type: 'text', text: sentText });

  // Add to history (image only for this send, not stored in history for future turns)
  const thisMessage = { role: 'user', content: userContent };

  // Build full messages array: history (text only) + this message
  const messages = [...history, thisMessage];

  try {
    // ── Calls your Vercel serverless function at /api/chat ──
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: SYSTEM_PROMPT, messages })
    });

    if (!res.ok) throw new Error(`API error ${res.status}`);

    const data = await res.json();
    const reply = data.content?.[0]?.text || "Hmm, I didn't get a response. Try again!";

    // Store only text in history to avoid massive payloads
    history.push({ role: 'user', content: sentText });
    history.push({ role: 'assistant', content: reply });

    removeTyping();
    appendMsg('ai', formatText(reply));
  } catch (err) {
    removeTyping();
    appendMsg('ai', '⚠️ Couldn\'t connect right now — try again in a sec!');
  }

  isLoading = false;
  sendBtn.disabled = false;
  input.focus();
}

function quickSend(text) { input.value = text; sendMessage(); }

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

// Welcome
window.addEventListener('DOMContentLoaded', () => {
  appendMsg('ai', `Hey! 👋 I'm your <strong>Summer Strong Trainer</strong> — here to help you crush your 90 days! ☀️<br><br>
Ask me anything about your daily goals, protein, water, rings, or workouts. You can also <strong>snap a food photo</strong> 📷 and I'll break it down for you!`, null, false);
});
</script>
</body>
</html>
